name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned so a new ruff release cannot fail an unrelated pull request.
      - name: Install ruff
        run: pip install ruff==0.16.7

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

  check:
    # Packaging is Windows-first, but the engine has to keep working on Linux,
    # so the import-level checks run on both.
    name: compile and smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Byte-compile the app, worker and scripts
        run: python -m compileall -q src scripts

      - name: Byte-compile the upscaling backend
        run: python -m compileall -q backend/src

      - name: Smoke-test the dependency-free modules
        run: python scripts/smoke.py
