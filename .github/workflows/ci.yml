name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned so a new ruff release cannot fail an unrelated pull request.
      - name: Install ruff
        run: pip install ruff==0.16.7

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

  check:
    # Packaging is Windows-first, but the engine has to keep working on Linux,
    # so the import-level checks run on both.
    name: compile, smoke and interface (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Byte-compile the app, worker and scripts
        run: python -m compileall -q src scripts

      - name: Byte-compile the upscaling backend
        run: python -m compileall -q backend/src

      - name: Smoke-test the dependency-free modules
        run: python scripts/smoke.py

      # Qt links against X11 and EGL even when it renders offscreen, and the
      # Linux runner does not ship those libraries.
      - name: Install the system libraries Qt links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0

      - name: Install Qt
        run: pip install PySide6-Essentials==6.11.2

      # Builds the real window with no display attached and measures it, so a
      # layout or styling regression fails here instead of on someone's
      # desktop.
      - name: Build the window and check its geometry
        run: python scripts/uicheck.py
        env:
          QT_QPA_PLATFORM: offscreen
