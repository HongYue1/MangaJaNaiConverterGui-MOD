name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned so a new ruff release cannot fail an unrelated pull request.
      - name: Install ruff
        run: pip install ruff==0.16.7

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned for the same reason ruff is: a new mypy release must not fail
      # an unrelated pull request.
      - name: Install mypy
        run: pip install mypy==2.3.1

      # --platform win32 is load-bearing. This runner is Linux, and mypy
      # resolves platform-specific stubs for the platform it targets, so
      # without the flag the os.startfile call in app/runner.py is an
      # attr-defined error even though sys.platform == "win32" already guards
      # it. Measured both ways: linux finds exactly that one false error,
      # win32 is clean across all 73 source files. The app ships on Windows,
      # so Windows is what CI has to type-check.
      #
      # No project dependencies are installed, deliberately: this is the same
      # dependency-free run the local gate does, and it is green. Pulling
      # torch and PySide6 into a type-check job would cost minutes and prove
      # nothing extra.
      - name: Type-check
        run: mypy --platform win32

  check:
    # Packaging is Windows-first, but the engine has to keep working on Linux,
    # so the import-level checks run on both.
    name: compile, smoke and interface (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Byte-compile the app, worker and scripts
        run: python -m compileall -q src scripts

      - name: Byte-compile the upscaling backend
        run: python -m compileall -q backend/src

      - name: Smoke-test the dependency-free modules
        run: python scripts/smoke.py

      # Drives the real tile planner with the allocator, the free memory and
      # the peak under test control. Three planner defects reached a build
      # because only a GPU run could expose them; these checks need neither a
      # GPU nor torch.
      - name: Check the tile planner
        run: python scripts/plannercheck.py

      # Bounded queues, ordered writes, locked tallies and the cancel paths
      # only misbehave under concurrency, and every one of these gates
      # reproduced a real defect before its fix. They import nothing heavier
      # than janai.worker.pipeline, janai.worker.control and janai.app.runlog,
      # all of which are stdlib-only, so they need no GPU and no torch, numpy
      # or pyvips - and no PySide6 either, which is why they can run here,
      # above the step that installs it.
      #
      # bash rather than the Windows default shell, for two reasons: a
      # multi-line pwsh block reports only the last command's exit code, so a
      # failing gate in the middle would pass silently, and the last gate has
      # to pipe a raw undecodable byte.
      #
      # archive_check.py, dryprobe_check.py and outname_check.py are
      # deliberately absent: they spawn a real worker, so they need the
      # upscaling stack and a GPU. So is close_check.py, which measures process
      # teardown timing, and archname_check.py, which decodes nothing but
      # imports janai.worker.job and therefore the imaging stack. Those stay
      # local gates; do not "complete the set" here. What outname_check.py and
      # archname_check.py prove end to end is covered in CI by smoke.py's
      # "output naming" and "page entries" checks.
      - name: Gate the pipeline primitives, the control reader and the done payload
        shell: bash
        run: |
          python scripts/prefetch_check.py
          python scripts/counters_check.py
          python scripts/writepool_check.py
          python scripts/bundle_check.py
          python scripts/donepages_check.py
          printf '\x81\ncancel\n' | python scripts/stdin_check.py --reconfigure

      # Qt links against X11 and EGL even when it renders offscreen, and the
      # Linux runner does not ship those libraries.
      - name: Install the system libraries Qt links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0

      - name: Install Qt
        run: pip install PySide6-Essentials==6.11.2

      # Builds the real window with no display attached and measures it, so a
      # layout or styling regression fails here instead of on someone's
      # desktop.
      - name: Build the window and check its geometry
        run: python scripts/uicheck.py
        env:
          QT_QPA_PLATFORM: offscreen
