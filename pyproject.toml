# JaNai Upscaler - project metadata, packaging and tooling.
#
# Layout:
#   src/janai/app      the Qt interface (PySide6)
#   src/janai/core     code shared by both processes
#   src/janai/worker   the out-of-process upscaling pipeline
#   scripts/           developer tools (smoke, selftest, bench)
#   backend/           vendored chaiNNer-derived backend + per-machine runtime

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janai-upscaler"
version = "1.0.0"
description = "Manga and illustration upscaler built on the MangaJaNai models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["upscaling", "manga", "esrgan", "spandrel", "jpeg-xl"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
# The upscaling dependencies are pinned in requirements.txt because torch has
# to be resolved against a GPU-specific index; setup.ps1 / setup.sh install
# them into backend/python, along with the interface's single dependency: Qt.
# PySide6-Essentials is the trimmed wheel (~77 MB) - the full PySide6 adds
# WebEngine, 3D, Charts and Multimedia, none of which this interface uses.
dependencies = ["PySide6-Essentials>=6.7,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
janai-upscaler = "janai.app.main:main"
janai-worker = "janai.worker.worker:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Ruff: one tool for both formatting and linting.
#
#   ruff format .        rewrite
#   ruff check .         lint
#   ruff check --fix .   lint and fix what is safely fixable
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
src = ["src", "scripts"]

# backend/ is vendored upstream code plus the per-machine runtime and weights.
# Linting it would mean carrying a diff against upstream forever, so it is left
# exactly as it ships.
extend-exclude = [
  "backend",
  "logs",
  ".tmp",
]

[tool.ruff.lint]
# Chosen for correctness and runtime cost rather than style purity:
#   E,W,F   pycodestyle + pyflakes, the baseline
#   I       import order, so a merge never reshuffles imports
#   N       consistent naming
#   UP      modern syntax for the Python we actually target
#   B       bugbear: mutable defaults, shadowed loop vars, silent bugs
#   A       no shadowing of builtins
#   C4      comprehensions instead of list()/dict() round trips
#   PERF    the performance rules: this is an image pipeline
#   FURB    modern, cheaper stdlib idioms
#   RUF     Ruff's own checks, incl. implicit string concatenation in lists
#   SIM     simplification, catches redundant branching in hot paths
#   RET     explicit returns, fewer accidental None paths
#   PIE     dead code and no-op statements
#   PTH     pathlib over os.path
#   LOG,G   logging called correctly and lazily
#   ISC     no accidentally concatenated string literals
#   TID     no relative-import spaghetti between the three packages
#   NPY     numpy-specific correctness (the worker is numpy-heavy)
#   PLC,PLE,PLW  the useful half of pylint
#   PGH     no blanket type-ignore / noqa
#   EXE,INT,Q,COM  shebangs, gettext, quote and comma hygiene
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "PERF", "FURB", "RUF",
  "SIM", "RET", "PIE", "PTH", "LOG", "G", "ISC", "TID", "NPY",
  "PLC", "PLE", "PLW", "PGH", "EXE", "INT", "Q",
]
ignore = [
  # The worker imports torch, numpy and pyvips inside functions on purpose:
  # a dry run and the --probe path must never pay for them.
  "PLC0415",
  # The GUI and the worker both catch broad exceptions deliberately: a failed
  # page must not kill a 200-page chapter, and a Tk callback must not take the
  # window down. Those sites are individually intentional.
  "BLE001",
  # Re-binding a loop variable while normalising a line/path is idiomatic here.
  "PLW2901",
  # Too many/few arguments: the pipeline functions take what they need.
  "PLR0913",
  # `datetime.now()` without a timezone is correct for local log timestamps.
  "DTZ005",
  # The worker keeps its cancel flag, model cache and tile planner in module
  # state on purpose: a job is one process, driven from one thread.
  "PLW0603",
  # `try/except pass` is kept over `contextlib.suppress`: the context manager
  # costs a call and a frame, and some of these sit on the per-tile path.
  "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# The worker CLI resolves sys.path before it can import anything of its own, so
# its imports legitimately follow executable statements. Only the entry file
# does this; the modules it imports are ordinary modules.
"src/janai/worker/worker.py" = ["E402"]
# `Cancelled` is control flow rather than an error, so it keeps its name. The
# ignore lives with the class, not with whoever imports it.
"src/janai/worker/control.py" = ["N818"]
# Same for the dev scripts, which run straight from a checkout.
"scripts/*.py" = ["E402", "T201"]
# Qt's own API is camelCase, so the methods that override it are camelCase too.
"src/janai/app/widgets.py" = ["N802"]
"src/janai/app/rules_table.py" = ["N802"]
"src/janai/app/window.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["janai"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy: the type checker, run dev-only exactly like ruff.
#
#   uvx mypy@1.18.2      check everything in scope (reads `files` below)
#
# Pinned and run through uvx deliberately: the shipped interpreter is
# backend/python, and a type checker has no business being installed into it.
# Zero packaging impact on the bundled build.
# --------------------------------------------------------------------------- #
[tool.mypy]
# The declared floor, matching requires-python and ruff's target-version -
# not the 3.13.9 the app happens to ship, or the checker would quietly accept
# syntax the declared floor rejects.
python_version = "3.11"
files = ["src/janai", "scripts"]
mypy_path = "src"

# torch, numpy, pyvips, spandrel, PySide6 and the vendored chaiNNer backend are
# installed only in backend/python, which this checker deliberately does not
# use. Every third-party import is therefore unresolvable by construction
# rather than by accident; our own code is still checked in full.
ignore_missing_imports = true

# Cheap, high-signal, and green as committed.
warn_unused_configs = true
warn_redundant_casts = true
strict_equality = true

# --------------------------------------------------------------------------- #
# Tier 1 - the contract modules: the pipeline primitives, the planner, the
# cancel signal, the stdout wire format and the log renderer. The invariants
# the whole app rests on live here, these files are clean today, so they are
# gated harder to keep them that way.
#
# disallow_any_generics, disallow_untyped_defs / disallow_incomplete_defs and
# warn_return_any are deliberately NOT on yet: measured 2026-09-14, those four
# account for every one of the 57 findings a full --strict run reports here
# (44 type-arg, 11 no-untyped-def, 2 no-any-return). They are switched on by
# the Phase 3 typing sweep, not before, so this tier stays green and therefore
# meaningful.
# --------------------------------------------------------------------------- #
[[tool.mypy.overrides]]
module = [
  "janai.core.*",
  "janai.worker.pipeline",
  "janai.worker.planning",
  "janai.worker.control",
  "janai.worker.events",
  "janai.app.runlog",
]
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
no_implicit_reexport = true
warn_unused_ignores = true
extra_checks = true

# --------------------------------------------------------------------------- #
# Tier 2 - four catalogued causes, measured 2026-09-14: 329 findings in 19 of
# 44 files, which are four structural patterns rather than 329 defects.
#
# Each block below suppresses ONLY the error codes its cause actually produces,
# so anything new in these files still fails the check, and each names the work
# that deletes it. A module appears in exactly one block on purpose: mypy
# merges overlapping override sections, and the result is not worth predicting.
# --------------------------------------------------------------------------- #

# Cause 1 - the Qt mixin split from Phase 1 (229 findings). Every panel is a
# mixin that legitimately reads attributes owned by the composed Window, which
# mypy cannot see until a Protocol declares that surface. Deleted by the commit
# that adds it.
[[tool.mypy.overrides]]
module = [
  "janai.app.perf_panel",
  "janai.app.output_panel",
  "janai.app.input_panel",
  "janai.app.log_panel",
]
disable_error_code = ["attr-defined", "has-type"]

# Same cause, plus one genuine residue to triage: run_panel.py:403 assigns a
# bool where a dict[str, Any] is declared.
[[tool.mypy.overrides]]
module = ["janai.app.run_panel"]
disable_error_code = ["attr-defined", "has-type", "assignment"]

# Cause 1 plus cause 3 - `rules.Rule` used in annotations below a method named
# `rules`, which shadows the module for annotation lookup (6 findings). Real
# defect; harmless today only because `from __future__ import annotations`
# leaves annotations unevaluated, so `typing.get_type_hints()` would raise.
[[tool.mypy.overrides]]
module = ["janai.app.rules_panel", "janai.app.rules_table"]
disable_error_code = ["attr-defined", "has-type", "name-defined"]

# Residue to triage - window.py:125 narrows a base-class `Path` to `Path | None`.
[[tool.mypy.overrides]]
module = ["janai.app.window"]
disable_error_code = ["assignment"]

# Cause 2 is FIXED. runtime.py's lazy handles now declare the type they hold
# once a loader binds them, so the 75 findings that one deliberate design
# produced are gone, and the seven modules that had nothing else wrong need no
# override at all. What survives below is genuine residue, not a pattern.

# Residue: devices.py:115 subclasses runtime.NodeContext, and the two cleanup
# sets at 121-122 need element types.
[[tool.mypy.overrides]]
module = ["janai.worker.devices"]
disable_error_code = ["valid-type", "var-annotated", "misc"]

# Residue: models.py:144 passes None as a next() default that is declared dict.
[[tool.mypy.overrides]]
module = ["janai.worker.models"]
disable_error_code = ["arg-type"]

# Residue worth real triage: job.py:687 indexes a value typed `dict | None`, and
# job.py:984 hands `str | None` to ZipFile.read, which would be a TypeError if
# that name were ever None.
[[tool.mypy.overrides]]
module = ["janai.worker.job"]
disable_error_code = ["index", "arg-type"]

# Cause 2b - `sys.stdin/stdout.reconfigure`. typeshed declares both as TextIO,
# which has no reconfigure; the real objects are TextIOWrapper. Every call site
# is already inside try/except because a re-parented stream genuinely can lack
# it, so the runtime behaviour is correct and only the annotation is wrong.
[[tool.mypy.overrides]]
module = ["janai.worker.worker", "stdin_check", "archname_check"]
disable_error_code = ["union-attr"]

# Cause 4 - gate-script residue (7 findings). These appeared only once
# `mypy_path = "src"` let the checker see the real janai types instead of Any,
# which is the whole reason the gates are in scope: plannercheck feeds an
# `int | None` to a parameter declared `int`, uicheck consumes the return value
# of `__setattr__` and widens a list to Sequence, and bundle_check binds its
# RefusingPool double to a name inferred as ThreadPoolExecutor. Gate-only code,
# no shipped behaviour, triaged with the rest of the residue.
[[tool.mypy.overrides]]
module = ["plannercheck", "uicheck", "bundle_check"]
disable_error_code = ["operator", "arg-type", "func-returns-value", "assignment"]
